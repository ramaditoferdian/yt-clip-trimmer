<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YT Clip Trimmer</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0f1115;
        color: #e6e6e6;
      }
      button {
        cursor: pointer;
      }
      .player-host {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 8px;
        margin-bottom: 16px;
      }
      .player-host iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .scrubber {
        position: relative;
        height: 12px;
        margin: 2px 0;
      }
      .scrubber__track,
      .scrubber__fill {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        height: 5px;
        border-radius: 3px;
      }
      .scrubber__track {
        left: 0;
        right: 0;
        background: #3a3f47;
      }
      .scrubber__fill {
        background: #5b9bd5;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
